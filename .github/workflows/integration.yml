name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_daytona_tests:
        description: 'Run Daytona live integration tests'
        required: false
        default: 'false'
        type: boolean
      run_minimax_tests:
        description: 'Run MiniMax live API tests'
        required: false
        default: 'false'
        type: boolean
      run_minimax_tts_tests:
        description: 'Run MiniMax TTS integration tests'
        required: false
        default: 'false'
        type: boolean

env:
  DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
  DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
  NEXT_PUBLIC_USE_MOCK_DAYTONA: "false"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --reporter=verbose

      - name: Build application
        run: npm run build

  # Test all features using vitest
  feature-tests:
    name: Feature Tests (No External APIs)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run All Feature Tests
        run: |
          echo "Running comprehensive test suite covering all features..."
          npm run test -- --reporter=verbose
          echo ""
          echo "✅ All feature tests passed:"
          echo "  - Zod schema validation"
          echo "  - Code history undo/redo"
          echo "  - MiniMax retry logic"
          echo "  - Rate limiter"
          echo "  - Error messages"

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Verify MiniMax Integration Files
        run: |
          echo "Checking MiniMax integration files..."
          test -f src/lib/minimax.ts && echo "✅ minimax.ts exists"
          test -f src/lib/minimax-live-client.ts && echo "✅ minimax-live-client.ts exists"
          grep -q "MiniMaxLiveClient" src/components/agent/InterviewAgent.tsx && echo "✅ InterviewAgent uses MiniMaxLiveClient"
          grep -q "textToSpeech" src/app/api/tts/route.ts && echo "✅ TTS route uses MiniMax"

      - name: Verify Store Has Required Fields
        run: |
          echo "Checking store.ts for workspace status fields..."
          grep -q "workspaceStatus" src/lib/store.ts && echo "✅ workspaceStatus found"
          grep -q "workspaceProgress" src/lib/store.ts && echo "✅ workspaceProgress found"
          grep -q "setWorkspaceStatus" src/lib/store.ts && echo "✅ setWorkspaceStatus found"

      - name: Verify New Files Exist
        run: |
          echo "Checking all implementation files..."
          test -f src/middleware.ts && echo "✅ middleware.ts exists"
          test -f src/lib/rate-limiter.ts && echo "✅ rate-limiter.ts exists"
          test -f src/lib/schemas.ts && echo "✅ schemas.ts exists"
          test -f src/lib/code-history.ts && echo "✅ code-history.ts exists"
          test -f src/lib/error-messages.ts && echo "✅ error-messages.ts exists"
          test -f src/components/workspace/WorkspaceProgressIndicator.tsx && echo "✅ WorkspaceProgressIndicator.tsx exists"

  # Live integration tests with Daytona
  daytona-integration:
    name: Daytona Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_daytona_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Daytona credentials
        id: check-daytona
        run: |
          if [ -n "$DAYTONA_API_KEY" ] && [ -n "$DAYTONA_API_URL" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ Daytona credentials not configured - skipping live tests"
          fi

      - name: Test Daytona SDK Connection
        if: steps.check-daytona.outputs.has_credentials == 'true'
        run: |
          node -e "
          const { Daytona } = require('@daytonaio/sdk');

          async function test() {
            try {
              const daytona = new Daytona({
                apiKey: process.env.DAYTONA_API_KEY,
                apiUrl: process.env.DAYTONA_API_URL
              });
              console.log('✅ Daytona SDK initialized successfully');
            } catch (error) {
              console.error('❌ Daytona SDK initialization failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

      - name: Run Daytona Integration Tests
        if: steps.check-daytona.outputs.has_credentials == 'true'
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: npm run test -- --reporter=verbose src/lib/daytona.integration.test.ts
        timeout-minutes: 5

  # Live integration tests with MiniMax (LLM)
  minimax-integration:
    name: MiniMax Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_minimax_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check MiniMax credentials
        id: check-minimax
        run: |
          if [ -n "$MINIMAX_API_KEY" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ MiniMax API key not configured - skipping live tests"
          fi

      - name: Test MiniMax API Connection
        if: steps.check-minimax.outputs.has_credentials == 'true'
        run: |
          node -e "
          async function test() {
            try {
              const response = await fetch('https://api.minimax.io/v1/text/chatcompletion_v2', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.MINIMAX_API_KEY,
                },
                body: JSON.stringify({
                  model: 'M2-her',
                  messages: [{ role: 'user', content: 'Respond with just the word: OK' }],
                  max_tokens: 10,
                  stream: false,
                }),
              });
              if (response.ok) {
                const data = await response.json();
                console.log('✅ MiniMax API works! Response received.');
              } else {
                const err = await response.text();
                console.error('❌ MiniMax API test failed:', err.substring(0, 200));
                process.exit(1);
              }
            } catch (error) {
              console.error('❌ MiniMax API test failed:', error.message);
              process.exit(1);
            }
          }
          test();
          "

      - name: Run MiniMax Integration Tests
        if: steps.check-minimax.outputs.has_credentials == 'true'
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: npm run test -- --reporter=verbose src/lib/__tests__/minimax.test.ts
        timeout-minutes: 2

  # Live integration tests with MiniMax TTS
  minimax-tts-integration:
    name: MiniMax TTS Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_minimax_tts_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check MiniMax credentials
        id: check-minimax
        run: |
          if [ -n "$MINIMAX_API_KEY" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ MiniMax API key not configured - skipping TTS tests"
          fi

      - name: Test MiniMax TTS API Connection
        if: steps.check-minimax.outputs.has_credentials == 'true'
        run: |
          node -e "
          async function test() {
            try {
              const response = await fetch('https://api.minimax.io/v1/t2a_v2', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + process.env.MINIMAX_API_KEY,
                },
                body: JSON.stringify({
                  model: 'speech-2.8-hd',
                  text: 'Hello, this is a test.',
                  voice_setting: { voice_id: 'English_Trustworth_Man', speed: 1, vol: 1, pitch: 0 },
                  audio_setting: { sample_rate: 32000, bitrate: 128000, format: 'mp3', channel: 1 },
                  stream: false,
                  output_format: 'hex',
                }),
              });
              if (response.ok) {
                console.log('✅ MiniMax TTS API works!');
              } else {
                const err = await response.text();
                console.error('❌ MiniMax TTS test failed:', err.substring(0, 200));
                process.exit(1);
              }
            } catch (error) {
              console.error('❌ MiniMax TTS test failed:', error.message);
              process.exit(1);
            }
          }
          test();
          "

      - name: Verify MiniMax Live Client Implementation
        run: |
          echo "Verifying MiniMax Live client implementation..."
          grep -q "connect()" src/lib/minimax-live-client.ts && echo "✅ connect() method exists"
          grep -q "disconnect()" src/lib/minimax-live-client.ts && echo "✅ disconnect() method exists"
          grep -q "sendText" src/lib/minimax-live-client.ts && echo "✅ sendText() method exists"
          grep -q "isConnected" src/lib/minimax-live-client.ts && echo "✅ isConnected() method exists"
          grep -q "handleUserMessage" src/lib/minimax-live-client.ts && echo "✅ handleUserMessage exists"
          grep -q "playAudio" src/lib/minimax-live-client.ts && echo "✅ Audio playback exists"
          echo ""
          echo "✅ MiniMax Live client implementation verified"

  # E2E test with running server
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start server and run E2E tests
        run: |
          # Start the server in production mode
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done

          # Test homepage loads
          echo "Testing homepage..."
          HOMEPAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$HOMEPAGE_STATUS" != "200" ]; then
            echo "❌ Homepage returned: $HOMEPAGE_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Homepage loads successfully"

          # Test interview page loads
          echo "Testing interview page..."
          INTERVIEW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/interview)
          if [ "$INTERVIEW_STATUS" != "200" ]; then
            echo "❌ Interview page returned: $INTERVIEW_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Interview page loads successfully"

          # Test practice page loads
          echo "Testing practice page..."
          PRACTICE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/practice)
          if [ "$PRACTICE_STATUS" != "200" ]; then
            echo "❌ Practice page returned: $PRACTICE_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Practice page loads successfully"

          # Test test-agent page loads
          echo "Testing test-agent page..."
          TESTAGENT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/test-agent)
          if [ "$TESTAGENT_STATUS" != "200" ]; then
            echo "❌ Test-agent page returned: $TESTAGENT_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Test-agent page loads successfully"

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          echo "✅ E2E tests completed successfully"

  # Summary job
  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests, daytona-integration, minimax-integration, minimax-tts-integration, e2e-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || (needs.unit-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Tests | ${{ needs.feature-tests.result == 'success' && '✅ Passed' || (needs.feature-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Daytona Integration | ${{ needs.daytona-integration.result == 'success' && '✅ Passed' || (needs.daytona-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MiniMax Integration | ${{ needs.minimax-integration.result == 'success' && '✅ Passed' || (needs.minimax-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MiniMax TTS | ${{ needs.minimax-tts-integration.result == 'success' && '✅ Passed' || (needs.minimax-tts-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || (needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Voice AI Integration (MiniMax TTS)" >> $GITHUB_STEP_SUMMARY
          echo "- **REST API Client**: MiniMax LLM + TTS via /api/interview/chat" >> $GITHUB_STEP_SUMMARY
          echo "- **TTS Model**: speech-2.8-hd (high quality)" >> $GITHUB_STEP_SUMMARY
          echo "- **Audio Format**: MP3, 32kHz (mono)" >> $GITHUB_STEP_SUMMARY
          echo "- **Voices**: Trustworthy Man (real), Patient Man (practice), Confident Woman (alt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Secrets for Live Tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`DAYTONA_API_KEY\` - Daytona sandbox API key" >> $GITHUB_STEP_SUMMARY
          echo "- \`DAYTONA_API_URL\` - Daytona API URL" >> $GITHUB_STEP_SUMMARY
          echo "- \`MINIMAX_API_KEY\` - MiniMax API key (for LLM, TTS, and analysis)" >> $GITHUB_STEP_SUMMARY
