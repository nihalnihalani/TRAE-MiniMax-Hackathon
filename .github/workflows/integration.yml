name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_daytona_tests:
        description: 'Run Daytona live integration tests'
        required: false
        default: 'false'
        type: boolean
      run_gemini_tests:
        description: 'Run Gemini live API tests'
        required: false
        default: 'false'
        type: boolean
      run_elevenlabs_tests:
        description: 'Run ElevenLabs TTS tests'
        required: false
        default: 'false'
        type: boolean

env:
  DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
  DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
  GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
  NEXT_PUBLIC_USE_MOCK_DAYTONA: "false"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --reporter=verbose

      - name: Build application
        run: npm run build

  # Test all new features without external APIs
  feature-tests:
    name: Feature Tests (No External APIs)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Zod Schema Validation
        run: |
          node -e "
          const { validateRequest, ExecuteCodeRequestSchema, PathSchema } = require('./src/lib/schemas');

          // Test valid request
          const valid = validateRequest(ExecuteCodeRequestSchema, {
            workspaceId: 'ws-123',
            code: 'print(\"hello\")',
            language: 'python'
          });
          if (!valid.success) throw new Error('Valid request failed validation');

          // Test invalid request
          const invalid = validateRequest(ExecuteCodeRequestSchema, {
            workspaceId: '',
            code: ''
          });
          if (invalid.success) throw new Error('Invalid request passed validation');

          // Test path security
          const malicious = PathSchema.safeParse('../../../etc/passwd');
          if (malicious.success) throw new Error('Directory traversal not blocked');

          console.log('✅ Zod schema validation working correctly');
          "

      - name: Test Code History (Undo/Redo)
        run: |
          node -e "
          const { CodeHistory } = require('./src/lib/code-history');

          const history = new CodeHistory();
          history.push({ code: 'initial', source: 'initial' });
          history.push({ code: 'edit 1', source: 'user' });
          history.push({ code: 'autofix', source: 'autofix' });

          if (history.getLength() !== 3) throw new Error('History length wrong');
          if (!history.canUndo()) throw new Error('Should be able to undo');

          const undone = history.undo();
          if (undone.code !== 'edit 1') throw new Error('Undo returned wrong code');

          const redone = history.redo();
          if (redone.code !== 'autofix') throw new Error('Redo returned wrong code');

          console.log('✅ Code history (undo/redo) working correctly');
          "

      - name: Test Rate Limiter
        run: |
          node -e "
          const { RateLimiter } = require('./src/lib/rate-limiter');

          const limiter = new RateLimiter();
          const ip = '127.0.0.1';
          const endpoint = '/api/test';

          // Should allow initial requests
          for (let i = 0; i < 5; i++) {
            const result = limiter.checkLimit(ip, endpoint, { tokensPerInterval: 5, interval: 60000 });
            if (!result.allowed && i < 5) throw new Error('Request ' + i + ' should be allowed');
          }

          // 6th request should be rate limited
          const limited = limiter.checkLimit(ip, endpoint, { tokensPerInterval: 5, interval: 60000 });
          if (limited.allowed) throw new Error('Should be rate limited after 5 requests');

          console.log('✅ Rate limiter working correctly');
          "

      - name: Test Error Messages
        run: |
          node -e "
          const { getUserFriendlyError, ERROR_MESSAGES } = require('./src/lib/error-messages');

          // Test known error code
          const rateLimitError = getUserFriendlyError('RATE_LIMIT_EXCEEDED');
          if (!rateLimitError.title) throw new Error('Missing error title');
          if (!rateLimitError.message) throw new Error('Missing error message');

          // Test unknown error code
          const unknownError = getUserFriendlyError('UNKNOWN_CODE');
          if (!unknownError.title) throw new Error('Unknown error should have fallback');

          console.log('✅ Error messages working correctly');
          "

      - name: Test Agent Reasoning (Mutex Protection)
        run: |
          node -e "
          const { AgentReasoning } = require('./src/lib/agent-reasoning');

          async function testMutex() {
            const agent = new AgentReasoning();
            await agent.resetProfile();

            // Test concurrent updates don't lose data
            const updates = [];
            for (let i = 0; i < 10; i++) {
              updates.push(agent.updateProfile({ type: 'hint_given' }));
            }
            await Promise.all(updates);

            const hints = await agent.getHintsGiven();
            if (hints !== 10) throw new Error('Expected 10 hints, got ' + hints + ' - race condition detected!');

            console.log('✅ Agent reasoning mutex protection working correctly');
          }

          testMutex().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Test Gemini Retry Config
        run: |
          node -e "
          const { GEMINI_RETRY_CONFIG } = require('./src/lib/constants');

          if (!GEMINI_RETRY_CONFIG) throw new Error('Missing GEMINI_RETRY_CONFIG');
          if (GEMINI_RETRY_CONFIG.maxAttempts !== 3) throw new Error('Expected 3 max attempts');
          if (GEMINI_RETRY_CONFIG.initialDelayMs !== 1000) throw new Error('Expected 1000ms initial delay');
          if (GEMINI_RETRY_CONFIG.backoffMultiplier !== 2) throw new Error('Expected 2x backoff');

          console.log('✅ Gemini retry config correct');
          "

      - name: Test Integrity Monitoring (Dynamic Scoring)
        run: |
          node -e "
          const { ReportGenerator } = require('./src/lib/reporting');

          const generator = new ReportGenerator();

          // Test that integrity scoring is dynamic, not hardcoded
          // Access private method via prototype for testing
          const score1 = generator['calculateCodeOriginality']({ pasteCount: 0, largePasteEvents: [] }, 'def test(): pass');
          const score2 = generator['calculateCodeOriginality']({ pasteCount: 20, largePasteEvents: [{ timestamp: 1, length: 500 }] }, 'def test(): pass');

          if (score1 === score2) throw new Error('Integrity scores should differ based on behavior');
          if (score1 <= score2) throw new Error('High paste count should lower score');

          console.log('✅ Integrity monitoring (dynamic scoring) working correctly');
          "

      - name: Test Workspace Progress Store
        run: |
          node -e "
          // Verify store has workspace status fields
          const storeCode = require('fs').readFileSync('./src/lib/store.ts', 'utf8');

          if (!storeCode.includes('workspaceStatus')) throw new Error('Missing workspaceStatus in store');
          if (!storeCode.includes('workspaceProgress')) throw new Error('Missing workspaceProgress in store');
          if (!storeCode.includes('setWorkspaceStatus')) throw new Error('Missing setWorkspaceStatus action');

          console.log('✅ Workspace progress store fields present');
          "

      - name: Test All Unit Tests Pass
        run: npm run test -- --reporter=verbose

  # Live integration tests with Daytona
  daytona-integration:
    name: Daytona Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_daytona_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Daytona credentials
        id: check-daytona
        run: |
          if [ -n "$DAYTONA_API_KEY" ] && [ -n "$DAYTONA_API_URL" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ Daytona credentials not configured - skipping live tests"
          fi

      - name: Test Daytona SDK Connection
        if: steps.check-daytona.outputs.has_credentials == 'true'
        run: |
          node -e "
          const { Daytona } = require('@daytonaio/sdk');

          async function test() {
            try {
              const daytona = new Daytona({
                apiKey: process.env.DAYTONA_API_KEY,
                apiUrl: process.env.DAYTONA_API_URL
              });
              console.log('✅ Daytona SDK initialized successfully');
            } catch (error) {
              console.error('❌ Daytona SDK initialization failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

      - name: Run Daytona Integration Tests
        if: steps.check-daytona.outputs.has_credentials == 'true'
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: npm run test -- --reporter=verbose src/lib/daytona.integration.test.ts
        timeout-minutes: 5

  # Live integration tests with Gemini
  gemini-integration:
    name: Gemini Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_gemini_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Gemini credentials
        id: check-gemini
        run: |
          if [ -n "$GOOGLE_AI_API_KEY" ] || [ -n "$GEMINI_API_KEY" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ Gemini API key not configured - skipping live tests"
          fi

      - name: Test Gemini API Connection
        if: steps.check-gemini.outputs.has_credentials == 'true'
        run: |
          node -e "
          const { GoogleGenerativeAI } = require('@google/generative-ai');

          async function test() {
            const apiKey = process.env.GOOGLE_AI_API_KEY || process.env.GEMINI_API_KEY;

            try {
              const genAI = new GoogleGenerativeAI(apiKey);
              const model = genAI.getGenerativeModel({ model: 'gemini-2.0-flash' });

              const result = await model.generateContent('Respond with just the word: OK');
              const text = result.response.text();

              console.log('✅ Gemini API works! Response:', text.trim().substring(0, 20));
            } catch (error) {
              console.error('❌ Gemini API test failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

      - name: Run Gemini Integration Tests
        if: steps.check-gemini.outputs.has_credentials == 'true'
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: npm run test -- --reporter=verbose src/lib/__tests__/gemini.test.ts
        timeout-minutes: 2

  # Live integration tests with ElevenLabs
  elevenlabs-integration:
    name: ElevenLabs Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_elevenlabs_tests == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check ElevenLabs credentials
        id: check-elevenlabs
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ ElevenLabs API key not configured - skipping live tests"
          fi

      - name: Test ElevenLabs API Connection
        if: steps.check-elevenlabs.outputs.has_credentials == 'true'
        run: |
          node -e "
          async function test() {
            const apiKey = process.env.ELEVENLABS_API_KEY;

            try {
              // Test voices endpoint
              const response = await fetch('https://api.elevenlabs.io/v1/voices', {
                headers: {
                  'xi-api-key': apiKey
                }
              });

              if (!response.ok) {
                throw new Error('API returned ' + response.status);
              }

              const data = await response.json();
              console.log('✅ ElevenLabs API works! Found', data.voices?.length || 0, 'voices');
            } catch (error) {
              console.error('❌ ElevenLabs API test failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

      - name: Test TTS Generation
        if: steps.check-elevenlabs.outputs.has_credentials == 'true'
        run: |
          node -e "
          async function test() {
            const apiKey = process.env.ELEVENLABS_API_KEY;
            const voiceId = 'cgSgspJ2msm6clMCkdW9'; // Jessica voice

            try {
              const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + voiceId, {
                method: 'POST',
                headers: {
                  'xi-api-key': apiKey,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  text: 'Test',
                  model_id: 'eleven_turbo_v2_5'
                })
              });

              if (!response.ok) {
                const error = await response.text();
                throw new Error('TTS failed: ' + response.status + ' - ' + error);
              }

              const audioBuffer = await response.arrayBuffer();
              console.log('✅ TTS generation works! Audio size:', audioBuffer.byteLength, 'bytes');
            } catch (error) {
              console.error('❌ TTS test failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

  # E2E test with running server
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start server and run E2E tests
        run: |
          # Start the server in production mode
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done

          # Test health endpoint
          echo "Testing API health..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
          if [ "$HEALTH_STATUS" != "200" ] && [ "$HEALTH_STATUS" != "404" ]; then
            echo "⚠️ Health check returned: $HEALTH_STATUS (may be expected if no health endpoint)"
          fi

          # Test homepage loads
          echo "Testing homepage..."
          HOMEPAGE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$HOMEPAGE_STATUS" != "200" ]; then
            echo "❌ Homepage returned: $HOMEPAGE_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Homepage loads successfully"

          # Test interview page loads
          echo "Testing interview page..."
          INTERVIEW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/interview)
          if [ "$INTERVIEW_STATUS" != "200" ]; then
            echo "❌ Interview page returned: $INTERVIEW_STATUS"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          echo "✅ Interview page loads successfully"

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          echo "✅ E2E tests completed successfully"

  # Summary job
  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests, daytona-integration, gemini-integration, elevenlabs-integration, e2e-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || (needs.unit-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Feature Tests | ${{ needs.feature-tests.result == 'success' && '✅ Passed' || (needs.feature-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Daytona Integration | ${{ needs.daytona-integration.result == 'success' && '✅ Passed' || (needs.daytona-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gemini Integration | ${{ needs.gemini-integration.result == 'success' && '✅ Passed' || (needs.gemini-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ElevenLabs Integration | ${{ needs.elevenlabs-integration.result == 'success' && '✅ Passed' || (needs.elevenlabs-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || (needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Secrets for Live Tests" >> $GITHUB_STEP_SUMMARY
          echo "- \`DAYTONA_API_KEY\` - Daytona sandbox API key" >> $GITHUB_STEP_SUMMARY
          echo "- \`DAYTONA_API_URL\` - Daytona API URL" >> $GITHUB_STEP_SUMMARY
          echo "- \`GOOGLE_AI_API_KEY\` - Google AI (Gemini) API key" >> $GITHUB_STEP_SUMMARY
          echo "- \`ELEVENLABS_API_KEY\` - ElevenLabs TTS API key" >> $GITHUB_STEP_SUMMARY
