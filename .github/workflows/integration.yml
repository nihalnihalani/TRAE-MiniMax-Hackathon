name: Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual triggers

env:
  DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
  DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  NEXT_PUBLIC_USE_MOCK_DAYTONA: "false"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start server and run integration tests
        run: |
          # Start the server in production mode
          npm run start &
          SERVER_PID=$!

          # Wait for server to be ready
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 2
          done

          # Run integration tests
          node scripts/integration-test.js
          TEST_EXIT_CODE=$?

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

          exit $TEST_EXIT_CODE

  verify-daytona:
    name: Verify Daytona Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_daytona_tests == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Daytona SDK Connection
        run: |
          node -e "
          const { Daytona } = require('@daytonaio/sdk');

          async function test() {
            if (!process.env.DAYTONA_API_KEY || !process.env.DAYTONA_API_URL) {
              console.log('⚠️ Daytona credentials not configured');
              process.exit(0);
            }

            try {
              const daytona = new Daytona({
                apiKey: process.env.DAYTONA_API_KEY,
                apiUrl: process.env.DAYTONA_API_URL
              });
              console.log('✅ Daytona SDK initialized successfully');
            } catch (error) {
              console.error('❌ Daytona SDK initialization failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "

  verify-gemini:
    name: Verify Gemini Integration
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test Gemini API Connection
        run: |
          node -e "
          const { GoogleGenerativeAI } = require('@google/generative-ai');

          async function test() {
            if (!process.env.GEMINI_API_KEY) {
              console.log('⚠️ Gemini API key not configured');
              process.exit(0);
            }

            try {
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: 'gemini-3-flash-preview' });

              const result = await model.generateContent('Say hello in one word');
              const text = result.response.text();

              console.log('✅ Gemini API works! Response:', text.substring(0, 50));
            } catch (error) {
              console.error('❌ Gemini API test failed:', error.message);
              process.exit(1);
            }
          }

          test();
          "
